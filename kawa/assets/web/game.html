<style>
/* Layout: full-bleed WebGL stage; UI floats as forged-metal panels over a night battlefield. Single dark look by design. */
:root{
  --night:#0b0910; --panel:rgba(22,15,18,.86); --panel2:rgba(36,24,24,.92);
  --ember:#ff7a2f; --flame:#ffb347; --gold:#f2c46d; --ash:#b6aaa0; --bone:#f5ebdd;
  --blood:#e2483d; --sky:#7fd6ff; --jade:#6fe0a8; --line:rgba(242,196,109,.24);
  --display:"Marcellus SC","Cinzel","Times New Roman",serif;
  --ui:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--night);color:var(--bone);font-family:var(--ui);overflow:hidden;
  -webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%}
#fx{position:fixed;inset:0;pointer-events:none;width:100%;height:100%}
#vign{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .35s;
  background:radial-gradient(ellipse at center,transparent 45%,rgba(200,20,10,.55) 100%)}
#vign.on{opacity:1;transition:none}
#shade{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 40%,transparent 50%,rgba(5,3,8,.7) 100%)}
.ic{width:1em;height:1em;fill:currentColor;flex:none;vertical-align:-.12em}
.coin{color:var(--gold)} .gem{color:#ff5d8f}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;padding:calc(var(--st) + 8px) max(12px,var(--sr)) 0 max(12px,var(--sl))}
.xpbar{position:relative;height:16px;border-radius:9px;background:rgba(10,8,14,.75);border:1px solid var(--line);overflow:hidden;margin-left:30px}
.xpbar i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,#2d8cff,#7fd6ff 70%,#e6fbff);box-shadow:0 0 12px #5ab8ff;transition:width .15s}
.lvl{position:absolute;left:max(6px,var(--sl));top:calc(var(--st) + 1px);width:38px;height:38px;display:grid;place-items:center;
  font:900 15px var(--ui);background:radial-gradient(circle at 35% 30%,#3a6fb8,#16294d);border:2px solid #9fd8ff;border-radius:50%;box-shadow:0 0 14px rgba(90,184,255,.6)}
.hrow{display:flex;align-items:center;gap:8px;margin-top:10px}
.chip{display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:20px;background:rgba(10,8,14,.7);border:1px solid var(--line);font:800 15px var(--ui);font-variant-numeric:tabular-nums}
#timer{flex:1;text-align:center;font:400 26px var(--display);letter-spacing:.06em;text-shadow:0 2px 10px #000}
#pauseBtn{pointer-events:auto;width:40px;height:40px;border-radius:12px;background:rgba(10,8,14,.7);border:1px solid var(--line);display:grid;place-items:center}
#skillbar{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.sk{position:relative;width:30px;height:30px;border-radius:9px;background:rgba(10,8,14,.72);border:1px solid var(--line);display:grid;place-items:center;font-size:17px}
.sk b{position:absolute;right:-4px;bottom:-4px;font:900 10px var(--ui);background:var(--gold);color:#2a1606;border-radius:6px;padding:1px 4px}
#bossbar{margin:12px auto 0;max-width:460px;text-align:center}
#bossbar span{font:400 15px var(--display);letter-spacing:.14em;color:#ff9a8a;text-shadow:0 0 10px #f00}
#bossbar div{height:12px;border-radius:7px;background:rgba(10,8,14,.8);border:1px solid rgba(255,90,80,.4);overflow:hidden;margin-top:4px}
#bossbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#7a0f2c,#e2483d,#ff9a5a);transition:width .2s}
#banner{position:fixed;left:0;right:0;top:32%;text-align:center;font:400 clamp(24px,6vw,44px) var(--display);letter-spacing:.08em;
  color:var(--flame);text-shadow:0 0 24px rgba(255,90,20,.9),0 3px 0 #000;opacity:0;transform:scale(.8);pointer-events:none;padding:0 16px;text-wrap:balance}
#banner.on{animation:ban 2.4s ease forwards}
@keyframes ban{0%{opacity:0;transform:scale(1.4)}12%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(.96)}}
#joy{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2px solid rgba(242,196,109,.35);
  background:radial-gradient(circle,rgba(255,180,90,.08),rgba(0,0,0,.25));pointer-events:none;opacity:0;transition:opacity .15s}
#joy.on{opacity:1}
#knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#ffd28a,#e0661f 60%,#7a2a0c);box-shadow:0 0 18px rgba(255,120,40,.7)}
.hint{position:fixed;left:0;right:0;bottom:calc(var(--sb) + 14%);text-align:center;font:700 15px var(--ui);color:var(--ash);
  letter-spacing:.04em;pointer-events:none;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}

/* ---------- HOME ---------- */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:calc(var(--st) + 10px) max(16px,var(--sr)) calc(var(--sb) + 14px) max(16px,var(--sl));pointer-events:none}
.screen > *{pointer-events:auto}
.topbar{display:flex;align-items:center;gap:8px}
.cur{display:flex;align-items:center;gap:7px;padding:6px 6px 6px 12px;border-radius:22px;background:var(--panel);border:1px solid var(--line);
  font:800 15px var(--ui);font-variant-numeric:tabular-nums;min-width:92px}
.cur span{flex:1}
.plus{width:24px;height:24px;border-radius:50%;background:linear-gradient(#5fd17c,#2c8d48);font:900 17px/1 var(--ui);display:grid;place-items:center}
.cur:not(.gemc) .plus{background:linear-gradient(#f5cf72,#b8862c);color:#3a2306}
.spacer{flex:1}
.iconbtn{width:42px;height:42px;border-radius:13px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;font-size:20px}
.logo{text-align:center;margin-top:3vh;pointer-events:none}
.logo small{display:block;font:700 12px var(--ui);letter-spacing:.42em;text-transform:uppercase;color:var(--gold);opacity:.85}
.logo h1{margin:4px 0 0;font:400 clamp(40px,11vw,74px)/1 var(--display);letter-spacing:.04em;
  background:linear-gradient(180deg,#fff3d6 10%,#ffc066 45%,#e2621d 80%,#8a2a0c);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px rgba(255,110,30,.45)) drop-shadow(0 4px 0 rgba(0,0,0,.6))}
.herosel{margin-top:auto;display:flex;align-items:center;justify-content:center;gap:10px}
.herosel .mid{min-width:190px;text-align:center}
.hname{font:400 30px var(--display);letter-spacing:.06em;text-shadow:0 2px 12px #000}
.hrole{font:700 12px var(--ui);letter-spacing:.24em;text-transform:uppercase;color:var(--ash)}
.hstart{display:inline-flex;align-items:center;gap:6px;margin-top:6px;padding:4px 10px;border-radius:12px;background:rgba(0,0,0,.45);font:600 12px var(--ui);color:var(--bone)}
.arrow{width:44px;height:44px;border-radius:50%;background:var(--panel);border:1px solid var(--line);font:400 26px/1 var(--display);color:var(--gold);display:grid;place-items:center}
.arrow.sm{width:34px;height:34px;font-size:20px}
.bottom{display:flex;flex-direction:column;gap:12px;margin-top:16px;width:100%;max-width:440px;align-self:center}
.chapter{display:flex;align-items:center;gap:10px;padding:10px;border-radius:18px;background:var(--panel);border:1px solid var(--line)}
.cinfo{flex:1;text-align:center;min-width:0}
.cinfo small{display:block;font:700 11px var(--ui);letter-spacing:.3em;color:var(--gold)}
.cinfo b{display:block;font:400 21px var(--display);letter-spacing:.04em;margin-top:2px}
.cinfo span{display:block;font:600 12px var(--ui);color:var(--ash);margin-top:2px}
.play{position:relative;height:66px;border-radius:20px;font:400 28px var(--display);letter-spacing:.14em;color:#2a1104;
  background:linear-gradient(180deg,#ffe1a1 0%,#ffb44a 38%,#f07a22 70%,#c4480f 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.65),inset 0 -5px 0 rgba(110,30,0,.55),0 8px 28px rgba(255,100,20,.42);overflow:hidden}
.play::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);transform:translateX(-120%);animation:sheen 3.2s ease-in-out infinite}
@keyframes sheen{60%,100%{transform:translateX(120%)}}
.play:active{transform:translateY(2px)}
.play.lock{background:linear-gradient(180deg,#e9d7ff,#a77bf0 45%,#6b3fc0);color:#1d0b3a;box-shadow:inset 0 2px 0 rgba(255,255,255,.6),inset 0 -5px 0 rgba(40,10,90,.55),0 8px 28px rgba(140,90,255,.4)}
.play.dis{filter:grayscale(.85) brightness(.6)}
.play small{display:block;font:700 13px var(--ui);letter-spacing:.06em;margin-top:-4px}
.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

/* ---------- SHEETS & MODALS ---------- */
.sheet{position:fixed;inset:0;background:rgba(4,3,6,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20;animation:fade .2s}

@keyframes up{from{transform:translateY(40%);opacity:0}}
@keyframes fade{from{opacity:0}}
.sheet header{display:flex;align-items:center;margin-bottom:12px}
.sheet h2{flex:1;margin:0;font:400 26px var(--display);letter-spacing:.06em;color:var(--gold)}

.sect{font:700 11px var(--ui);letter-spacing:.3em;text-transform:uppercase;color:var(--ash);margin:8px 2px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 10px 10px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--line);text-align:center}
.item .big{font-size:34px;line-height:1}
.item .amt{font:800 18px var(--ui);font-variant-numeric:tabular-nums}
.item .tag{position:absolute;top:-8px;left:50%;transform:translateX(-50%);white-space:nowrap;padding:2px 8px;border-radius:8px;background:var(--blood);font:800 10px var(--ui);letter-spacing:.08em}
.price{width:100%;padding:9px 0;border-radius:11px;background:linear-gradient(#5fd17c,#2c8d48);font:800 15px var(--ui);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.price.g{background:linear-gradient(#ff7aa6,#c23462)}
.price.o{background:linear-gradient(#f5cf72,#b8862c);color:#2a1606}
.price:disabled{filter:grayscale(1) brightness(.6)}
.hero-offer{display:flex;align-items:center;gap:14px;padding:16px;border-radius:18px;text-align:left;
  background:radial-gradient(circle at 15% 20%,rgba(255,140,40,.35),transparent 60%),linear-gradient(135deg,#3b1f16,#1d1015);border:1px solid rgba(255,170,80,.5)}
.hero-offer .t{flex:1;min-width:0}
.hero-offer b{display:block;font:400 22px var(--display);color:var(--flame)}
.hero-offer span{display:block;font:600 13px var(--ui);color:var(--ash);margin-top:3px}
.hero-offer .price{width:auto;padding:10px 16px}
.row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.row .ibox{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-size:24px;background:rgba(0,0,0,.35);color:var(--gold);flex:none}
.row .t{flex:1;min-width:0}
.row b{display:block;font:700 15px var(--ui)}
.row span{display:block;font:500 12px var(--ui);color:var(--ash);margin-top:2px}
.pips{display:flex;gap:3px;margin-top:6px}
.pips i{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.1)}
.pips i.on{background:linear-gradient(90deg,var(--flame),var(--ember))}
.row .price{width:96px;flex:none;display:flex;align-items:center;justify-content:center;gap:5px}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.dayc{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line);font:700 12px var(--ui)}
.dayc .big{font-size:24px}
.dayc.done{opacity:.4}
.dayc.now{border-color:var(--flame);box-shadow:0 0 16px rgba(255,140,40,.35);background:rgba(255,140,40,.1)}
.dayc.d7{grid-column:span 2}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 4px;border-bottom:1px solid rgba(255,255,255,.06);font:600 15px var(--ui)}
.seg{display:flex;background:rgba(0,0,0,.35);border-radius:11px;padding:3px}
.seg button{padding:7px 12px;border-radius:9px;font:700 13px var(--ui);color:var(--ash)}
.seg button.on{background:var(--gold);color:#2a1606}
.btn{padding:13px 18px;border-radius:14px;font:800 15px var(--ui);letter-spacing:.04em;background:rgba(255,255,255,.08);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn.pri{background:linear-gradient(180deg,#ffd38a,#f0862a 60%,#c4480f);color:#2a1104;border:0;box-shadow:inset 0 -4px 0 rgba(110,30,0,.45)}
.btn.ad{background:linear-gradient(180deg,#89f0a8,#2c9b55);color:#062612;border:0;box-shadow:inset 0 -4px 0 rgba(0,60,20,.4)}
.btn.danger{color:#ff9a8a}

.modal{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:calc(var(--st) + 16px) max(16px,var(--sr)) calc(var(--sb) + 16px) max(16px,var(--sl));background:rgba(4,3,6,.66);animation:fade .2s}
.mod-in{width:100%;max-width:560px;text-align:center;max-height:100%;overflow-y:auto}
.mod-in h2{margin:0;font:400 clamp(30px,8vw,46px) var(--display);letter-spacing:.06em;color:var(--flame);text-shadow:0 0 22px rgba(255,120,30,.7);text-wrap:balance}
.mod-in .sub{margin:4px 0 16px;font:600 14px var(--ui);color:var(--ash);letter-spacing:.06em}
#cards{display:grid;gap:10px}
.card{display:flex;align-items:center;gap:14px;padding:14px;border-radius:18px;text-align:left;
  background:linear-gradient(135deg,rgba(60,38,30,.95),rgba(26,17,20,.95));border:1px solid var(--line);
  animation:cin .35s cubic-bezier(.2,.9,.3,1.2) backwards;transition:transform .12s}
.card:nth-child(2){animation-delay:.07s}.card:nth-child(3){animation-delay:.14s}
@keyframes cin{from{transform:translateY(30px) scale(.9);opacity:0}}
.card:active{transform:scale(.97)}
.card .ibox{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font-size:30px;flex:none;background:rgba(0,0,0,.4);box-shadow:inset 0 0 0 2px currentColor}
.card .t{flex:1;min-width:0}
.card b{display:flex;align-items:center;gap:8px;font:700 17px var(--ui)}
.card b em{font:900 10px var(--ui);font-style:normal;letter-spacing:.1em;padding:2px 6px;border-radius:6px;background:var(--gold);color:#2a1606}
.card b em.new{background:var(--jade);color:#06291a}
.card p{margin:4px 0 0;font:500 13px/1.35 var(--ui);color:var(--ash)}
.card .pips{max-width:140px}
.mrow{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.stats div{padding:10px 4px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.stats small{display:block;font:700 10px var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--ash)}
.stats b{display:block;font:800 19px var(--ui);font-variant-numeric:tabular-nums;margin-top:3px}
.reward{display:flex;justify-content:center;gap:12px;margin:6px 0 4px}
.reward div{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:16px;background:rgba(0,0,0,.4);border:1px solid var(--line);font:800 22px var(--ui)}
.note{font:600 13px var(--ui);color:var(--gold);margin-top:6px}
#revCircle{width:110px;height:110px;margin:14px auto;border-radius:50%;display:grid;place-items:center;font:900 44px var(--ui);
  background:conic-gradient(var(--flame) var(--p,100%),rgba(255,255,255,.08) 0);position:relative}
#revCircle::before{content:"";position:absolute;inset:8px;border-radius:50%;background:#1a1114}
#revCircle span{position:relative}
#toast{position:fixed;left:50%;bottom:calc(var(--sb) + 28%);transform:translateX(-50%);z-index:60;padding:11px 18px;border-radius:14px;background:rgba(20,14,16,.95);border:1px solid var(--line);font:700 14px var(--ui);white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis;animation:fade .2s}
#sim{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
#sim b{font:400 24px var(--display);color:var(--gold);text-align:center}
#sim span{font:600 13px var(--ui);color:var(--ash)}
#sim .bar{width:min(260px,80%);height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
#sim .bar i{display:block;height:100%;width:0;background:var(--gold);animation:fill 1.3s linear forwards}
@keyframes fill{to{width:100%}}
#loading{position:fixed;inset:0;z-index:80;background:var(--night);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
#loading h1{margin:0;font:400 44px var(--display);color:var(--flame)}
#loading p{margin:0;font:600 13px var(--ui);color:var(--ash);letter-spacing:.2em}
@media (min-aspect-ratio:4/3){
  .logo{margin-top:1vh}.logo h1{font-size:clamp(36px,6vw,64px)}
  .bottom{max-width:400px}
}
