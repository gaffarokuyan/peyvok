<canvas id="c" width="1920" height="1080"></canvas>
<script>
const W=1920,H=1080, TAU=Math.PI*2;
const cv=document.getElementById('c'); let X=cv.getContext('2d');
// ---------- utils ----------
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const ss=(a,b,t)=>{t=clamp((t-a)/(b-a));return t*t*(3-2*t)};
const eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eout=t=>1-Math.pow(1-clamp(t),3);
const eback=t=>{t=clamp(t);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
function rng(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s^=s>>>17;s^=s<<5;return((s>>>0)%100000)/100000}}
function hash(i){let x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)}
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
const GOLD='#e9c46a', GOLD2='#f6dc93', EMBER='#ff7a2f';
function goldGrad(ctx,y0,y1){const g=ctx.createLinearGradient(0,y0,0,y1);g.addColorStop(0,'#fff3c4');g.addColorStop(.35,'#f2cf74');g.addColorStop(.55,'#b8862b');g.addColorStop(.75,'#f5d27a');g.addColorStop(1,'#8a5a14');return g}

// value noise for textures
function noise2(seed){const P=[];const r=rng(seed);for(let i=0;i<512;i++)P.push(r());
  const f=(x,y)=>{const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
    const h=(a,b)=>P[((a*57+b*131)&511+512)%512];
    const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
    return lerp(lerp(h(xi,yi),h(xi+1,yi),u),lerp(h(xi,yi+1),h(xi+1,yi+1),u),v)};
  return (x,y,o=5)=>{let s=0,a=.5,fr=1;for(let i=0;i<o;i++){s+=a*f(x*fr,y*fr);a*=.5;fr*=2}return s}}

// ---------- precomputed layers ----------
const GRAIN=[0,1,2,3].map(k=>{const c=mk(960,540),g=c.getContext('2d'),d=g.createImageData(960,540),r=rng(99+k);
  for(let i=0;i<d.data.length;i+=4){const v=r()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}g.putImageData(d,0,0);return c});
const VIG=(()=>{const c=mk(W,H),g=c.getContext('2d');const r=g.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*1.05);
  r.addColorStop(0,'rgba(0,0,0,0)');r.addColorStop(1,'rgba(0,0,0,.85)');g.fillStyle=r;g.fillRect(0,0,W,H);return c})();

// smoke/cloud texture
const SMOKE=(()=>{const c=mk(1024,512),g=c.getContext('2d'),n=noise2(7),d=g.createImageData(1024,512);
  for(let y=0;y<512;y++)for(let x=0;x<1024;x++){const v=n(x/160,y/110,6);const a=clamp((v-.42)*2.6);const i=(y*1024+x)*4;
    d.data[i]=255;d.data[i+1]=230;d.data[i+2]=210;d.data[i+3]=a*255*Math.min(1,Math.sin(Math.PI*y/512)*1.4)*Math.min(1,Math.sin(Math.PI*x/1024)*3)}
  g.putImageData(d,0,0);return c})();

// mountain ridge layers for battle
function ridge(seed,base,amp,rough,color,w=2600){const c=mk(w,H),g=c.getContext('2d'),n=noise2(seed);
  g.beginPath();g.moveTo(0,H);for(let x=0;x<=w;x+=4){const y=base-amp*(n(x/rough,seed*.37,6)-.3)*1.6;g.lineTo(x,y)}g.lineTo(w,H);g.closePath();
  g.fillStyle=color;g.fill();return c}
const RIDGES=[ridge(11,560,260,520,'#5a2a2e'),ridge(23,640,240,420,'#3a1a20'),ridge(37,720,200,330,'#22100f'),ridge(51,820,120,260,'#0f0706')];

// cuneiform texture
const CUNEI=(()=>{const c=mk(W,H),g=c.getContext('2d'),r=rng(5);g.fillStyle='rgba(233,196,106,1)';
  for(let row=0;row<26;row++){let x=20+r()*30;const y=30+row*42;while(x<W-20){const k=r();
    g.save();g.translate(x,y);g.rotate(k<.5?0:(k<.8?Math.PI/2:Math.PI/4));const s=8+r()*8;
    g.beginPath();g.moveTo(-s*.6,-s*.5);g.lineTo(s*.6,-s*.5);g.lineTo(0,s*1.1);g.closePath();g.globalAlpha=.5+r()*.5;g.fill();g.restore();
    x+=12+r()*22;if(r()<.08)x+=40}}return c})();

// ---------- MAP ----------
const RAD=Math.PI/180;
const mercY=lat=>Math.log(Math.tan(Math.PI/4+lat*RAD/2));
let CAM={lon:44,lat:33,s:1000,rot:0};
function P(lon,lat){return[W/2+(lon-CAM.lon)*RAD*CAM.s,H/2-(mercY(lat)-mercY(CAM.lat))*CAM.s]}
const CC={ '792':['#13a39a','TÜRKİYE',[35.2,39.1]], '364':['#2fae5f','İRAN',[54.5,32.6]], '368':['#e0962d','IRAK',[42.2,32.6]],
 '760':['#8b63e6','SURİYE',[38.6,35.3]], '682':['#355c9a','S. ARABİSTAN',[44.5,24]], '400':['#4b6fb0','ÜRDÜN',[36.6,30.9]],
 '051':['#c04b6b','ERMENİSTAN',[44.9,40.3]], '031':['#3b8fc4','AZERB.',[47.8,40.4]], '268':['#a05bb5','GÜRCİSTAN',[43.6,42.2]],
 '414':['#d2b548',''], '422':['#5f86c6',''], '376':['#4a73a8',''], '275':['#4a73a8',''], '818':['#3a5486','MISIR',[30,26.5]],
 '795':['#2c7a7a','TÜRKMENİSTAN',[59,39.4]], '004':['#476a8f','AFGANİSTAN',[66,33.8]], '586':['#2d6b52',''], '196':['#5a7fb5',''],
 '643':['#2b3f66',''], '634':['#3d5e8d',''], '784':['#3d5e8d',''], '512':['#34548a',''], '048':['#3d5e8d',''], '887':['#2f4b7c',''] };
const RIVERS={
 dicle:[[39.4,38.5],[40.24,37.91],[41.0,37.8],[41.41,37.71],[42.19,37.33],[42.7,36.95],[43.13,36.34],[43.25,35.6],[43.68,34.6],[43.87,34.2],[44.2,33.7],[44.37,33.31],[44.9,32.8],[45.82,32.5],[46.6,32.1],[47.15,31.84],[47.43,31.0],[47.8,30.5],[48.5,29.95]],
 firat:[[38.5,39.3],[38.75,38.8],[38.3,38.0],[37.98,37.0],[38.3,36.5],[39.0,35.95],[40.14,35.33],[40.92,34.45],[41.5,34.4],[42.38,34.13],[43.3,33.42],[43.78,33.35],[44.42,32.48],[44.9,32.0],[45.28,31.31],[46.26,31.05],[47.43,31.0]],
 zap:[[44.6,36.9],[44.0,36.4],[43.4,36.1],[43.3,35.9]], kzap:[[45.3,36.2],[44.6,35.9],[44.0,35.5],[43.4,35.2]], diyala:[[46.0,35.3],[45.6,34.9],[45.2,34.2],[44.8,33.6],[44.5,33.2]]
};
const ZAGROS=[[43.2,37.6],[44.5,37.0],[45.6,36.2],[46.5,35.2],[47.4,34.2],[48.4,33.2],[49.3,32.3],[50.3,31.3],[51.3,30.4],[52.4,29.6],[53.8,28.7],[55.5,27.8]];
const TAURUS=[[30.0,37.0],[32.0,37.0],[34.0,37.3],[36.0,37.9],[37.8,38.2],[39.6,38.5],[41.4,38.5],[43.0,38.1]];
const GUTIUM=[[44.0,36.4],[45.4,36.8],[46.8,35.9],[47.8,34.6],[47.3,33.6],[45.9,33.8],[44.9,34.3],[43.9,35.3]];
const AKKAD_EMP=[[36.3,36.6],[38.5,37.4],[41.5,37.5],[43.8,36.8],[44.6,35.4],[45.6,34.1],[47.0,32.8],[48.4,31.0],[48.6,29.7],[47.4,29.6],[45.9,30.3],[44.4,31.2],[42.9,32.4],[41.2,33.7],[39.4,34.6],[37.4,35.2]];
const GUTI_RULE=[[43.6,34.6],[44.9,34.3],[46.4,33.3],[47.8,31.4],[47.6,30.3],[46.2,30.6],[44.6,31.4],[43.3,32.9]];
const SITES=[['Akad',44.1,33.1,'akad'],['Kiş',44.6,32.54],['Nippur',45.23,32.13],['Uruk',45.64,31.32],['Ur',46.1,30.96],['Lagaş',46.4,31.41],['Susa',48.25,32.19],['Ninova',43.15,36.36]];
// mountain glyphs along ridges
function glyphsAlong(line,n,width,seed){const r=rng(seed),out=[];let L=[],tot=0;
  for(let i=1;i<line.length;i++){const d=Math.hypot(line[i][0]-line[i-1][0],line[i][1]-line[i-1][1]);L.push(d);tot+=d}
  for(let k=0;k<n;k++){let u=r()*tot,i=0;while(u>L[i]){u-=L[i];i++}const a=line[i],b=line[i+1],f=u/L[i];
    const dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy),nx=-dy/l,ny=dx/l,o=(r()-.5)*width*(1-Math.abs(r()-.5));
    out.push([lerp(a[0],b[0],f)+nx*o,lerp(a[1],b[1],f)+ny*o,.5+r()*.8])}
  return out.sort((p,q)=>q[1]-p[1])}
const MTN=glyphsAlong(ZAGROS,420,2.2,3).concat(glyphsAlong(TAURUS,240,1.4,4)).sort((p,q)=>q[1]-p[1]);

function pathRing(ring,close=true){X.beginPath();ring.forEach(([lo,la],i)=>{const[x,y]=P(lo,la);i?X.lineTo(x,y):X.moveTo(x,y)});if(close)X.closePath()}
function partial(line,f){ // returns sub-polyline up to fraction f
  if(f>=1)return line;let L=[],tot=0;for(let i=1;i<line.length;i++){const d=Math.hypot(line[i][0]-line[i-1][0],line[i][1]-line[i-1][1]);L.push(d);tot+=d}
  let u=f*tot,out=[line[0]];for(let i=0;i<L.length;i++){if(u>L[i]){out.push(line[i+1]);u-=L[i]}else{const a=line[i],b=line[i+1],t=u/L[i];out.push([lerp(a[0],b[0],t),lerp(a[1],b[1],t)]);break}}return out}

function glowText(txt,x,y,font,fill,alpha,glow='rgba(233,196,106,.6)',blur=18,spacing=0){
  if(alpha<=0)return;X.save();X.globalAlpha=alpha;X.font=font;X.textAlign='center';X.textBaseline='middle';
  if(spacing)X.letterSpacing=spacing+'px';
  X.shadowColor=glow;X.shadowBlur=blur;X.fillStyle=fill;X.fillText(txt,x,y);X.shadowBlur=0;X.fillText(txt,x,y);X.restore()}

function camAt(t){ // keyframes: t, lon, lat, lonWidth, rot
  const K=[[0,44,33,120,-2],[2.2,44.5,34.6,42,0],[6.8,45.6,34.4,13.5,1.2],[9.8,45.2,33.2,10,.4],[13.6,45.0,33.6,17,-.6],[16,45,33.6,19,-.6]];
  let i=0;while(i<K.length-2&&t>K[i+1][0])i++;const a=K[i],b=K[i+1],f=eio(clamp((t-a[0])/(b[0]-a[0])));
  const w=Math.exp(lerp(Math.log(a[3]),Math.log(b[3]),f));
  CAM={lon:lerp(a[1],b[1],f),lat:lerp(a[2],b[2],f),s:W/(w*RAD),rot:lerp(a[4],b[4],f)*RAD}}

function drawMap(t){
  camAt(t);
  // ocean
  const og=X.createRadialGradient(W*.5,H*.45,100,W*.5,H*.5,W*.75);og.addColorStop(0,'#0d2440');og.addColorStop(1,'#040a16');
  X.fillStyle=og;X.fillRect(0,0,W,H);
  X.save();X.translate(W/2,H/2);X.rotate(CAM.rot);X.translate(-W/2,-H/2);
  // graticule
  X.strokeStyle='rgba(120,170,230,.10)';X.lineWidth=1;
  const step=CAM.s>6000?1:(CAM.s>2500?2:5);
  for(let lo=-20;lo<=100;lo+=step){X.beginPath();const a=P(lo,0),b=P(lo,65);X.moveTo(a[0],a[1]);X.lineTo(b[0],b[1]);X.stroke()}
  for(let la=0;la<=65;la+=step){X.beginPath();const a=P(-20,la),b=P(100,la);X.moveTo(a[0],a[1]);X.lineTo(b[0],b[1]);X.stroke()}
  // countries
  const zoomK=clamp((CAM.s-1500)/6000); // 0 wide ->1 close
  for(const c of GEO){const cc=CC[c.id];const col=cc?cc[0]:'#24324f';
    for(const ring of c.rings){pathRing(ring);
      X.fillStyle=col;X.globalAlpha=cc?lerp(.78,.5,zoomK):.55;X.fill();
      X.globalAlpha=1;}
  }
  // land shading texture (inner darkening)
  X.globalAlpha=1;
  // borders
  for(const c of GEO){for(const ring of c.rings){pathRing(ring);X.strokeStyle='rgba(255,255,255,.18)';X.lineWidth=5;X.stroke();X.strokeStyle='rgba(255,250,235,.85)';X.lineWidth=1.4;X.stroke()}}
  // mountains
  const ms=clamp(CAM.s/9000,.25,1.6);
  for(const [lo,la,k] of MTN){const[x,y]=P(lo,la);if(x<-50||x>W+50||y<-50||y>H+50)continue;const s=22*k*ms;
    X.beginPath();X.moveTo(x-s,y);X.lineTo(x,y-s*1.1);X.lineTo(x+s,y);X.closePath();X.fillStyle='rgba(40,28,20,.55)';X.fill();
    X.beginPath();X.moveTo(x-s,y);X.lineTo(x,y-s*1.1);X.lineTo(x-s*.1,y);X.closePath();X.fillStyle='rgba(255,236,200,.42)';X.fill();
    X.beginPath();X.moveTo(x-s*.28,y-s*.8);X.lineTo(x,y-s*1.1);X.lineTo(x+s*.25,y-s*.82);X.closePath();X.fillStyle='rgba(255,255,255,.55)';X.fill()}
  // rivers (animated draw)
  const rf=ss(1.5,6,t);
  for(const k in RIVERS){const line=partial(RIVERS[k],k.length>5?rf:rf);const main=k==='dicle'||k==='firat';
    pathRing(line,false);X.lineCap='round';X.lineJoin='round';X.strokeStyle='rgba(90,200,255,.25)';X.lineWidth=main?9:5;X.stroke();
    X.strokeStyle='#8fe3ff';X.lineWidth=main?2.6:1.4;X.stroke()}
  // Zagros highlight
  const zg=ss(3.6,5,t)*(1-ss(12.5,14,t)*.6);
  if(zg>0){pathRing(ZAGROS,false);X.strokeStyle=`rgba(255,170,60,${.35*zg})`;X.lineWidth=60*ms;X.stroke();X.strokeStyle=`rgba(255,220,140,${.5*zg})`;X.lineWidth=8*ms;X.stroke()}
  // Akkad empire
  const ak=ss(8.2,9.2,t)*(1-ss(10.6,11.8,t)*.75);
  if(ak>0){pathRing(AKKAD_EMP);X.fillStyle=`rgba(233,196,106,${.28*ak})`;X.fill();X.setLineDash([14,10]);X.lineDashOffset=-t*40;X.strokeStyle=`rgba(255,226,150,${.9*ak})`;X.lineWidth=3;X.stroke();X.setLineDash([])}
  // Gutium region
  const gu=ss(6.9,7.6,t);
  if(gu>0){const pulse=.5+.5*Math.sin(t*5);pathRing(GUTIUM);
    const [cx,cy]=P(45.9,35.1);const rg=X.createRadialGradient(cx,cy,10,cx,cy,CAM.s*.035);rg.addColorStop(0,`rgba(255,80,40,${.65*gu})`);rg.addColorStop(1,`rgba(160,20,20,${.35*gu})`);
    X.fillStyle=rg;X.fill();X.strokeStyle=`rgba(255,${150+60*pulse},90,${gu})`;X.lineWidth=4+3*pulse;X.shadowColor='#ff5a1f';X.shadowBlur=30;X.stroke();X.shadowBlur=0}
  // Gutian rule over Sumer/Akkad
  const gr=ss(11.6,12.8,t);
  if(gr>0){X.save();pathRing(GUTI_RULE);X.clip();const [cx,cy]=P(46,34.9);const R=gr*CAM.s*.09;const rr=X.createRadialGradient(cx,cy,R*.6,cx,cy,R);
    rr.addColorStop(0,'rgba(220,40,30,.45)');rr.addColorStop(.95,'rgba(255,90,40,.5)');rr.addColorStop(1,'rgba(255,90,40,0)');X.fillStyle=rr;X.fillRect(0,0,W,H);X.restore();
    pathRing(GUTI_RULE);X.setLineDash([10,8]);X.strokeStyle=`rgba(255,120,80,${gr})`;X.lineWidth=2.5;X.stroke();X.setLineDash([])}
  // invasion arrows
  const ar=ss(9.9,11.3,t);
  if(ar>0){const targets=[[44.1,33.1],[45.23,32.13],[45.64,31.32],[46.3,31.4]];
    targets.forEach((tg,i)=>{const f=clamp(ar*1.25-i*.08);if(f<=0)return;const a=P(45.9+i*.25,35.2-i*.15),b=P(tg[0],tg[1]);
      const mx=(a[0]+b[0])/2-80,my=(a[1]+b[1])/2-40;const N=40;X.beginPath();let px,py;
      for(let k=0;k<=N*f;k++){const u=k/N;px=(1-u)*(1-u)*a[0]+2*(1-u)*u*mx+u*u*b[0];py=(1-u)*(1-u)*a[1]+2*(1-u)*u*my+u*u*b[1];k?X.lineTo(px,py):X.moveTo(px,py)}
      X.lineCap='round';X.strokeStyle='rgba(255,60,30,.35)';X.lineWidth=22;X.stroke();X.strokeStyle='#ffb36b';X.lineWidth=6;X.stroke();
      const u=Math.max(.01,f),dx=2*(1-u)*(mx-a[0])+2*u*(b[0]-mx),dy=2*(1-u)*(my-a[1])+2*u*(b[1]-my),an=Math.atan2(dy,dx);
      X.save();X.translate(px,py);X.rotate(an);X.beginPath();X.moveTo(18,0);X.lineTo(-14,-14);X.lineTo(-6,0);X.lineTo(-14,14);X.closePath();X.fillStyle='#ffd9a0';X.shadowColor='#ff5a1f';X.shadowBlur=20;X.fill();X.restore()})}
  // sites
  const sa=ss(8.0,9.0,t);
  for(const [nm,lo,la,tag] of SITES){const[x,y]=P(lo,la);let a=sa;if(a<=0)continue;
    let col='#fff1c9';if(tag==='akad'){const br=ss(10.9,11.4,t);col=br?'#ff6b4a':'#fff1c9';

// ---------- SOURCES ----------
const CARDS=[['MUHAMMED EMİN ZEKİ BEG','Xulasey Tarîxî Kurd û Kurdistan','Bağdat · 1931','Gutileri Kürt milletinin ilk katmanı sayar'],

  X.font='600 28px Corm';X.fillStyle='#d9ccb0';wrap(c[3],0,225,420,32);
  if(shine>0&&shine<1){X.save();X.beginPath();X.rect(-w/2,-h/2,w,h);X.clip();X.globalCompositeOperation='lighter';const sx=lerp(-w,w,shine);const g=X.createLinearGradient(sx-120,0,sx+120,0);g.addColorStop(0,'rgba(255,230,170,0)');g.addColorStop(.5,'rgba(255,230,170,.35)');g.addColorStop(1,'rgba(255,230,170,0)');X.fillStyle=g;X.rotate(.3);X.fillRect(-w,-h,w*2,h*2);X.restore()}
  X.restore()}
function wrap(txt,x,y,maxW,lh){const words=txt.split(' ');const lines=[];let cur='';for(const w of words){const tst=cur?cur+' '+w:w;if(X.measureText(tst).width>maxW&&cur){lines.push(cur);cur=w}else cur=tst}lines.push(cur);
  const y0=y-(lines.length-1)*lh/2;lines.forEach((l,i)=>X.fillText(l,x,y0+i*lh))}
function drawSources(t){ // local t 0..7.3
  const bg=X.createRadialGradient(W/2,H/2,100,W/2,H/2,W*.7);bg.addColorStop(0,'#1a1220');bg.addColorStop(1,'#050308');X.fillStyle=bg;X.fillRect(0,0,W,H);

}

function drawLogo(t){ // local 0..5.4
  X.fillStyle='#030207';X.fillRect(0,0,W,H);
  const bg=X.createRadialGradient(W/2,H/2-40,0,W/2,H/2,900);bg.addColorStop(0,`rgba(90,40,20,${.6*ss(0,1,t)})`);bg.addColorStop(1,'rgba(0,0,0,0)');X.fillStyle=bg;X.fillRect(0,0,W,H);

  X.beginPath();X.moveTo(cx+20,cy+90-170*mk2);X.lineTo(cx+5,cy+90-135*mk2);X.lineTo(cx+20,cy+90-145*mk2);X.lineTo(cx+35,cy+90-130*mk2);X.closePath();X.fillStyle='#fff8e1';X.fill();X.restore();
  // DÎROK text

    g.globalCompositeOperation='source-in';const sx=lerp(cx-700,cx+700,sw);const gr=g.createLinearGradient(sx-140,0,sx+140,0);gr.addColorStop(0,'rgba(255,255,255,0)');gr.addColorStop(.5,'rgba(255,255,255,.95)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,W,H);
    X.save();X.globalCompositeOperation='lighter';X.drawImage(tc,0,0);X.restore()}

const SC=[{a:0,b:13.75,f:drawMap},{a:13.6,b:15.45,f:t=>drawBattleWide(t-13.6)},{a:15.3,b:17.55,f:t=>drawDuel(t-15.3)},{a:17.4,b:24.75,f:t=>drawSources(t-17.4)},{a:24.6,b:30.2,f:t=>drawLogo(t-24.6)}];
const BUF=mk(W,H),BX=BUF.getContext('2d');
function renderFrame(T){

  if(T>29.3){X.fillStyle=`rgba(0,0,0,${clamp((T-29.3)/.7)})`;X.fillRect(0,0,W,H)}
}
window.renderFrame=renderFrame;
window.ready=(async()=>{const fams=['700 40px Cinzel','900 40px CinzelD','italic 600 40px Corm','600 40px Inter'];for(const f of fams){await document.fonts.load(f,'ÂÎŞĞİÜÖÇşğıüöçâî');}await document.fonts.ready;return true})();
