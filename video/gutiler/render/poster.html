function glyphsAlong(line,n,width,seed){const r=rng(seed),out=[];let L=[],tot=0;
  for(let i=1;i<line.length;i++){const d=Math.hypot(line[i][0]-line[i-1][0],line[i][1]-line[i-1][1]);L.push(d);tot+=d}
  for(let k=0;k<n;k++){let u=r()*tot,i=0;while(u>L[i]){u-=L[i];i++}const a=line[i],b=line[i+1],f=u/L[i];

// ---------- MASTER ----------
const SC=[{a:0,b:13.75,f:drawMap},{a:13.6,b:15.45,f:t=>drawBattleWide(t-13.6)},{a:15.3,b:17.55,f:t=>drawDuel(t-15.3)},{a:17.4,b:24.75,f:t=>drawSources(t-17.4)},{a:24.6,b:30.2,f:t=>drawLogo(t-24.6)}];
const BUF=mk(W,H),BX=BUF.getContext('2d');
function renderFrame(T){
  X.setTransform(1,0,0,1,0,0);X.globalAlpha=1;X.globalCompositeOperation='source-over';X.fillStyle='#000';X.fillRect(0,0,W,H);
  const act=SC.filter(s=>T>=s.a&&T<s.b);
  act.forEach((s,i)=>{
    if(i===0){X.save();s.f(T);X.restore()}
    else{const prev=act[i-1];const k=clamp((T-s.a)/(prev.b-s.a));
      // render new scene into buffer then composite with crossfade + zoom blur
      const main=X;BX.setTransform(1,0,0,1,0,0);BX.clearRect(0,0,W,H);
      try{X=BX;s.f(T)}finally{X=main}
      main.save();main.globalAlpha=eio(k);const z=lerp(1.08,1,eio(k));main.translate(W/2,H/2);main.scale(z,z);main.translate(-W/2,-H/2);main.drawImage(BUF,0,0);main.restore();
      // flash on transition
      main.fillStyle=`rgba(255,220,180,${.35*Math.sin(Math.PI*k)})`;main.fillRect(0,0,W,H)}
  });
  // letterbox, vignette, grain
  X.setTransform(1,0,0,1,0,0);X.globalAlpha=1;X.globalCompositeOperation='source-over';
  X.save();X.globalAlpha=T<13.7?.5:1;X.drawImage(VIG,0,0);X.restore();
  X.save();X.globalAlpha=T<13.7?.03:.07;X.globalCompositeOperation='overlay';X.drawImage(GRAIN[Math.floor(T*24)%4],0,0,W,H);X.restore();
  X.fillStyle='#000';X.fillRect(0,0,W,56);X.fillRect(0,H-56,W,56);
  // channel bug
  if(T<24.4){X.save();X.globalAlpha=.75*ss(1,2,T);X.font='900 30px CinzelD';X.textAlign='right';X.letterSpacing='4px';X.fillStyle=goldGrad(X,80,120);X.fillText('DÎROK',W-60,110);X.restore()}
  // fade in/out
  if(T<.6){X.fillStyle=`rgba(0,0,0,${1-T/.6})`;X.fillRect(0,0,W,H)}
  if(T>29.3){X.fillStyle=`rgba(0,0,0,${clamp((T-29.3)/.7)})`;X.fillRect(0,0,W,H)}
}
