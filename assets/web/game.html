<style>
/* Peyvok — "Zimrûd" design system.
   Garanti BBVA greens (#2C873A brand, #002808 deep) + BBVA navy/aqua accents.
   Backgrounds are drawn in code (see BG engine); every 6 levels the theme rotates and
   re-tints tiles via --tile/--tile-hi/--tile-deep/--acc/--glow. */
:root{
  --g900:#00140A; --g800:#002808; --g700:#00451F; --g600:#1E6A2C; --g500:#2C873A; --g400:#3FAE55; --g300:#6BE38A; --g200:#B5F2C4; --g100:#EAF7EE;
  --navy:#072146; --aqua:#2DCCCD;
  --tile:#2C873A; --tile-hi:#4CC163; --tile-deep:#17602A; --acc:#6BE38A; --glow:rgba(107,227,138,.35);
  --ink:#0A2614; --ink2:#5B7564; --line:#E3EEE6; --on:#fff; --gold:#FFC93C; --red:#E5484D;
  --font-d:"Baloo 2","Arial Rounded MT Bold",system-ui,sans-serif;
  --font-b:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease-pop:cubic-bezier(.3,1.6,.5,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0; background:var(--g900); color:var(--on); font-family:var(--font-b); overflow:hidden; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; touch-action:none}
canvas#scene{position:fixed; inset:0; width:100%; height:100%; z-index:0}
.screen{position:fixed; inset:0; z-index:1; display:flex; justify-content:center;
  padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px));
  padding-top:calc(10px + env(safe-area-inset-top,0px)); padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));
  opacity:0; visibility:hidden; transform:scale(1.03); transition:opacity .45s ease, transform .45s ease, visibility .45s}
.screen.show{opacity:1; visibility:visible; transform:none}
.col{width:100%; max-width:480px; height:100%; display:flex; flex-direction:column; align-items:center}
button{font:inherit; color:inherit}
button:focus-visible{outline:3px solid var(--acc); outline-offset:3px}
.badge[hidden]{display:none}

/* ---------- surfaces ---------- */
.glass{background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.04)),rgba(0,26,11,.38);
  border:1px solid rgba(255,255,255,.16); backdrop-filter:blur(14px) saturate(1.4); -webkit-backdrop-filter:blur(14px) saturate(1.4);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18), 0 8px 24px rgba(0,10,4,.22)}
.bar{width:100%; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px}
.bar>:first-child{justify-self:start}.bar>:last-child{justify-self:end}
.coins{display:flex; align-items:center; gap:6px; height:34px; padding:0 14px 0 4px; border-radius:999px; font:900 .95rem var(--font-b); font-variant-numeric:tabular-nums; color:#fff}
.coin{width:26px; height:26px; border-radius:50%; flex:none; position:relative;
  background:radial-gradient(circle at 34% 28%,#fffbe0 0 12%,#ffd84a 32%,#f2a900 72%,#c27800);
  box-shadow:inset 0 -2px 0 rgba(120,60,0,.35), 0 2px 6px rgba(0,0,0,.25)}
.coin::after{content:""; position:absolute; inset:5px; border-radius:50%; border:2px solid rgba(160,90,0,.4)}
.coins.bump{animation:bump .35s}
@keyframes bump{50%{transform:scale(1.12)}}
.rbtn{width:38px; height:38px; border-radius:50%; display:grid; place-items:center; cursor:pointer; color:#fff; padding:0}
.rbtn svg{width:19px; height:19px}

/* ---------- primary CTA: Garanti green pill ---------- */
.btn3d{position:relative; overflow:hidden; border:0; cursor:pointer; color:#fff; border-radius:999px; height:58px; min-width:220px; padding:0 30px;
  background:linear-gradient(180deg,#63D879 0%,#38A54C 46%,#2C873A 100%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.22), inset 0 2px 0 rgba(255,255,255,.4), inset 0 -3px 0 rgba(0,40,10,.25), 0 14px 32px rgba(10,120,50,.45);
  font:900 1.08rem var(--font-b); letter-spacing:.14em; text-shadow:0 1px 0 rgba(0,50,15,.35); transition:transform .1s, filter .1s}
.btn3d::after{content:""; position:absolute; top:-20%; bottom:-20%; width:22%; left:-40%; transform:skewX(-22deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent); animation:shine 3.4s ease-in-out infinite}
@keyframes shine{0%,60%{left:-40%}100%{left:140%}}
.btn3d:active{transform:translateY(2px) scale(.98); filter:brightness(.96)}
.btn3d:disabled{filter:grayscale(.7) brightness(.8); cursor:default}
.home .btn3d{animation:ping 2.4s ease-out infinite}
@keyframes ping{0%{box-shadow:inset 0 0 0 1px rgba(255,255,255,.22), inset 0 2px 0 rgba(255,255,255,.4), inset 0 -3px 0 rgba(0,40,10,.25), 0 14px 32px rgba(10,120,50,.45), 0 0 0 0 rgba(107,227,138,.55)}
  70%,100%{box-shadow:inset 0 0 0 1px rgba(255,255,255,.22), inset 0 2px 0 rgba(255,255,255,.4), inset 0 -3px 0 rgba(0,40,10,.25), 0 14px 32px rgba(10,120,50,.45), 0 0 0 16px rgba(107,227,138,0)}}

/* ---------- home ---------- */
.logo{margin-top:7vh; display:flex; flex-direction:column; align-items:center; gap:16px}
.tiles{display:flex; gap:6px}
.lt{width:min(13vw,54px); height:min(13vw,54px); border-radius:15px; display:grid; place-items:center; padding-top:4px;
  font:800 min(8.8vw,36px)/1 var(--font-d); color:#fff; text-shadow:0 1px 0 rgba(0,0,0,.2);
  background:linear-gradient(180deg,var(--tile-hi),var(--tile) 55%,var(--tile-deep));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45), inset 0 -3px 0 rgba(0,0,0,.18), 0 12px 26px rgba(0,16,6,.45);
  animation:drop .7s var(--ease-pop) both, float 4s ease-in-out infinite; animation-delay:calc(var(--i)*90ms), calc(var(--i)*300ms + .8s)}
.lt:nth-child(n+5){background:linear-gradient(180deg,#fff,#E6F3EA); color:var(--tile-deep); text-shadow:none; box-shadow:inset 0 -3px 0 rgba(0,60,20,.1), 0 12px 26px rgba(0,16,6,.45)}
.lt:nth-child(odd){rotate:-4deg}.lt:nth-child(even){rotate:3deg}
@keyframes drop{0%{transform:translateY(-60px) scale(.6); opacity:0}100%{transform:none; opacity:1}}
@keyframes float{50%{translate:0 -6px}}
.tag{font:900 .72rem var(--font-b); letter-spacing:.34em; text-transform:uppercase; padding:7px 16px; border-radius:999px; color:rgba(255,255,255,.9)}
.ring{margin-top:4vh; position:relative; width:164px; height:164px; display:grid; place-items:center}
.ring svg{position:absolute; inset:0; transform:rotate(-90deg); filter:drop-shadow(0 0 10px var(--glow))}
.ring .in{width:124px; height:124px; border-radius:50%; display:grid; place-items:center; text-align:center}
.ring b{display:block; font:800 2.9rem/1 var(--font-d); color:#fff; padding-top:6px}
.ring span{font:900 .62rem var(--font-b); letter-spacing:.18em; text-transform:uppercase; color:var(--acc)}
.where{margin-top:16px; display:flex; align-items:center; gap:8px; padding:8px 16px; border-radius:999px; font:800 .9rem var(--font-b)}
.where svg{width:15px; height:15px; color:var(--acc)}
.homeRow{display:flex; gap:14px; align-items:center; justify-content:center; margin-top:auto; margin-bottom:4vh}
.homeRow{width:100%}
.home .btn3d{margin:0; flex:1 1 auto; min-width:0; max-width:240px}
.cardBtn{width:58px; height:58px; border-radius:50%; display:grid; place-items:center; cursor:pointer; position:relative; color:#fff; padding:0}
.cardBtn svg{width:26px; height:26px}
.cardBtn .badge{position:absolute; top:-4px; right:-4px; min-width:22px; height:22px; padding:0 6px; border-radius:11px; background:#fff; color:var(--tile-deep); font:900 .72rem var(--font-b); display:grid; place-items:center; box-shadow:0 2px 8px rgba(0,0,0,.3)}
.spinBtn .badge{display:none}
.spinBtn.ready .badge{display:grid; background:var(--red); color:#fff; animation:pulse 1.4s ease-in-out infinite}
.spinBtn.ready{animation:wob 2.6s ease-in-out infinite}
@keyframes wob{0%,80%,100%{transform:none}85%{transform:rotate(-12deg)}90%{transform:rotate(10deg)}95%{transform:rotate(-6deg)}}
@keyframes pulse{50%{transform:scale(1.18)}}

/* ---------- game ---------- */
.chip{display:flex; flex-direction:column; align-items:center; padding:4px 18px 5px; border-radius:999px; line-height:1.15}
.chip b{font:900 .86rem var(--font-b); letter-spacing:.16em}

  {n:"Çiyayê Agirî",r:0,sun:[.76,.3],pt:"snow",f:["Dünyanın sayılı yüksek dağlarından biri, 5.137 metre. Adı Kurmancîde 'ateşli dağ' anlamına gelir.","One of the world's great high mountains at 5,137 m. Its Kurmanji name means 'fiery mountain'.","Yek ji çiyayên bilind ên navdar ên cîhanê ye, 5.137 metre. Navê wî ji peyva 'agir' tê."]},
  {n:"Girava Axtamarê",r:0,sun:[.28,.3],pt:"petal",f:["Van Gölü'ndeki adada 10. yüzyıldan kalma Kutsal Haç Kilisesi bulunur.","The island in Lake Van holds the 10th-century Church of the Holy Cross.","Li girava Gola Wanê Dêra Xaça Pîroz heye, ku ji sedsala 10an maye."]},
  {n:"Çiyayê Nemrûdê",r:0,sun:[.82,.42],pt:"spark",f:["Kommagene Kralı I. Antiokhos'un MÖ 1. yüzyılda yaptırdığı tümülüs ve dev heykeller. UNESCO Dünya Mirası.","Tomb mound and giant statues built for King Antiochus I of Commagene in the 1st century BC. A UNESCO World Heritage Site.","Gora mezin û peykerên dêw ên Qralê Komagenê Antiyokhosê I, ji sedsala 1ê berî zayînê. Mîrateya Cîhanê ya UNESCOyê ye."]},
  {n:"Hesenkêf",r:0,sun:[.7,.28],pt:"bird",f:["Dicle kıyısında binlerce yıllık yerleşim. Tarihî kentin büyük kısmı 2020'de baraj suları altında kaldı.","A settlement on the Tigris for thousands of years. Most of the old town went under dam waters in 2020.","Bi hezaran sal e ku li ber çemê Dîcleyê jiyan heye. Piraniya bajarê kevn di 2020an de di bin ava bendavê de ma."]},
  {n:"Mêrdîn",r:0,sun:[.18,.24],pt:"spark",f:["Taş evleriyle Mezopotamya ovasına bakan şehir. Kürt, Süryani ve Arap kültürleri burada buluşur.","A city of carved stone houses overlooking the Mesopotamian plain, where Kurdish, Syriac and Arab cultures meet.","Bajarekî bi xaniyên kevirî ye ku li deşta Mezopotamyayê dinêre. Çandên kurdî, suryanî û erebî li vir digihêjin hev."]},
  {n:"Kela Hewlêrê",r:1,sun:[.8,.28],pt:"dust",f:["Erbil Kalesi, dünyada kesintisiz yerleşilen en eski yerlerden biri sayılır. 2014'ten beri UNESCO Dünya Mirası.","Erbil Citadel is counted among the oldest continuously inhabited places on Earth. A UNESCO site since 2014.","Kela Hewlêrê yek ji wan cihên herî kevn e ku mirov bê navber lê jiyane. Ji 2014an ve Mîrateya Cîhanê ya UNESCOyê ye."]},
  {n:"Geliyê Rewandizê",r:1,sun:[.5,.16],pt:"bird",f:["Derin kanyondan geçen yol, 1930'larda açılan tarihî Hamilton Yolu'nun parçasıdır.","The road through the gorge is part of the historic Hamilton Road, built in the 1930s.","Rêya ku di vî geliyê kûr re derbas dibe, beşek ji Rêya Hamiltonê ye ku di salên 1930an de hat vekirin."]},
  {n:"Amêdî",r:1,sun:[.8,.22],pt:"dust",f:["Dört yanı uçurum olan düz bir kaya platosunun üstüne kurulmuş tarihî kasaba.","A historic town built on a flat rock plateau with cliffs on every side.","Bajarokekî dîrokî ye ku li ser zinarekî pan hatiye avakirin; li her çar aliyên wî kendal hene."]},
  {n:"Laliş",r:1,sun:[.2,.26],pt:"dust",f:["Ezidilerin en kutsal tapınağı. Ziyaretçiler avluya yalınayak girer.","The holiest Yazidi sanctuary. Visitors enter its courtyards barefoot.","Perestgeha herî pîroz a êzidiyan e. Mêvan bi pêxwasî dikevin hewşa wê."]},
  {n:"Geliyê Elî Beg",r:1,sun:[.82,.16],pt:"mist",f:["Bölgenin en ünlü şelalelerinden biri, Rewandiz yakınında.","One of the region's best-known waterfalls, near Rawanduz.","Yek ji sûlavên herî navdar ên herêmê ye, li nêzî Rewandizê."]},
  {n:"Hewraman",r:2,sun:[.25,.2],pt:"mist",f:["Evlerin damı üstteki evin avlusudur. Hewraman 2021'de UNESCO Dünya Mirası oldu.","Each roof is the yard of the house above. Hawraman became a UNESCO World Heritage Site in 2021.","Banê her xaniyî hewşa xaniyê jor e. Hewraman di 2021an de ket lîsteya Mîrateya Cîhanê ya UNESCOyê."]},
  {n:"Gola Zrêbarê",r:2,sun:[.7,.3],pt:"mist",f:["Merîwan yakınında, meşe ormanlarıyla çevrili tatlı su gölü.","A freshwater lake near Marivan, surrounded by oak forests.","Golek ava şirîn e li nêzî Merîwanê; dora wê daristanên berûyan in."]},
  {n:"Taqwesan",r:2,sun:[.85,.14],pt:"leaf",f:["Kirmaşan'da kayaya oyulmuş Sasani dönemi kemerleri ve kabartmaları.","Sasanian-era arches and reliefs carved into the rock at Kermanshah.","Li Kirmaşanê kevan û nexşên dema Sasaniyan ku di nav zinar de hatine kolan."]},
  {n:"Bîsitûn",r:2,sun:[.85,.2],pt:"mist",f:["Pers Kralı I. Darius'un yazıtı burada. Çivi yazısının çözülmesinde önemli rol oynadı. UNESCO Dünya Mirası.","Home of King Darius I's inscription, key to deciphering cuneiform. A UNESCO World Heritage Site.","Nivîsara Qralê Farisan Dariyosê I li vir e; di xwendina nivîsa bizmarî de roleke mezin lîst. Mîrateya Cîhanê ya UNESCOyê ye."]},
  {n:"Sine",r:2,sun:[.5,.05],pt:"dust",f:["Senendec'in tarihî çarşısı el dokuması kilimleri ve müzik aletleriyle bilinir.","Sanandaj's old bazaar is known for hand-woven kilims and musical instruments.","Bazara kevn a Sineyê bi kilîm û xalîçeyên destçêkirî û amûrên muzîkê navdar e."]},
  {n:"Pira Eyndiwerê",r:3,sun:[.82,.38],pt:"ember",f:["Dicle üzerindeki Orta Çağ köprüsünden geriye kalan büyük kemer.","The great surviving arch of a medieval bridge over the Tigris.","Kevana mezin a ku ji pireke Serdema Navîn a li ser Dîcleyê maye."]},
  {n:"Girê Mozan",r:3,sun:[.25,.4],pt:"ember",f:["Antik Hurri kenti Urkêş'in kalıntıları. Tarihi MÖ 3. binyıla uzanır.","Ruins of the ancient Hurrian city of Urkesh, dating back to the 3rd millennium BC.","Bermahiyên bajarê kevnar ê Hûriyan, Urkêş. Dîroka wê digihêje hezarsala 3an a berî zayînê."]},
  {n:"Girê Helef",r:3,sun:[.8,.34],pt:"ember",f:["Halaf kültürüne adını veren höyük. Ünlü boyalı çanak çömlekleri MÖ 6. binyıldan.","The mound that named the Halaf culture, famous for painted pottery from the 6th millennium BC.","Ev gir navê xwe da çanda Helefê; firaxên wê yên boyaxkirî ji hezarsala 6an a berî zayînê ne."]},
  {n:"Efrîn",r:3,sun:[.2,.36],pt:"petal",f:["Bölgenin zeytini, zeytinyağı ve sabunu yüzyıllardır ünlüdür.","The region's olives, olive oil and soap have been famous for centuries.","Zeytûn, rûnê zeytûnê û sabûna vê herêmê bi sedsalan e navdar in."]},
  {n:"Nebî Horî",r:3,sun:[.5,.34],pt:"ember",f:["Antik Kyrrhos kenti. Roma tiyatrosu ve hâlâ ayakta duran Roma köprüleriyle bilinir.","The ancient city of Cyrrhus, known for its Roman theatre and Roman bridges still standing.","Bajarê kevnar Kûrûs; bi şanoya Romayê û pirên Romayê yên ku hîn li ser piyan in navdar e."]}

const spinLeft=()=>SPIN_MAX-spinState().used;
// rewarded-ad hook: replaced by AdMob in the app build; web demo resolves after a short pause
window.showRewardedAd=window.showRewardedAd||(()=>new Promise(r=>setTimeout(()=>r(true),1200)));
function wheelSVG(){const n=SPIN_SEG.length,R=150,a=2*Math.PI/n;let s=`<defs>${SPIN_COL.map((c,i)=>`<radialGradient id="sg${i}" cx="50%" cy="50%" r="60%"><stop offset="35%" stop-color="${c[0]}"/><stop offset="100%" stop-color="${c[1]}"/></radialGradient>`).join("")}
  <radialGradient id="hub" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#fff6d0"/><stop offset=".5" stop-color="#f2c45a"/><stop offset="1" stop-color="#a86a12"/></radialGradient>
  <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#CFE9D6"/><stop offset="1" stop-color="#5E9C6E"/></linearGradient></defs>
  <circle r="${R+14}" fill="url(#rim)"/><circle r="${R+4}" fill="#03200E"/>`;
  SPIN_SEG.forEach((g,i)=>{const a0=i*a-Math.PI/2-a/2,a1=a0+a,x0=R*Math.cos(a0),y0=R*Math.sin(a0),x1=R*Math.cos(a1),y1=R*Math.sin(a1),mid=(a0+a1)/2,deg=mid*180/Math.PI+90;
    s+=`<path d="M0 0L${x0} ${y0}A${R} ${R} 0 0 1 ${x1} ${y1}Z" fill="url(#sg${i})" stroke="rgba(255,255,255,.35)" stroke-width="2"/>`;
    const lx=Math.cos(mid),ly=Math.sin(mid);
    s+=`<g transform="translate(${lx*R*.66} ${ly*R*.66}) rotate(${deg})">`+(g.t==="c"
      ?`<circle cy="-14" r="11" fill="url(#hub)" stroke="#8a5410" stroke-width="1.5"/><text y="16" text-anchor="middle" font-family="Montserrat,Nunito,system-ui,sans-serif" font-weight="900" font-size="22" fill="#fff4d6" stroke="rgba(0,0,0,.35)" stroke-width="1" paint-order="stroke">${g.v}</text>`
      :`<path d="M-7 -24a10 10 0 1 1 14 0c-2 2-3 4-3 6h-8c0-2-1-4-3-6z" fill="#fff6d0" stroke="#8a5410" stroke-width="1.5"/><rect x="-4" y="-16" width="8" height="4" rx="1" fill="#e2a640"/><text y="16" text-anchor="middle" font-family="Montserrat,Nunito,system-ui,sans-serif" font-weight="900" font-size="20" fill="#fff4d6" stroke="rgba(0,0,0,.35)" stroke-width="1" paint-order="stroke">×${g.v}</text>`)+`</g>`});
  for(let i=0;i<n;i++){const t=i*a-Math.PI/2-a/2;s+=`<circle cx="${(R+9)*Math.cos(t)}" cy="${(R+9)*Math.sin(t)}" r="3.6" fill="#ffffff"/>`}
  return s}
function openSpin(auto){const t=SL();spinState();
  $("#layer").innerHTML=`<div class="scrim spinScrim" id="scrim"><div class="spinBox">
    <button class="spinX" id="spinX" aria-label="Close">✕</button>
    <h3 class="spinT">${t.t}</h3><p class="spinSub">${t.sub}</p>
    <div class="spinWrap"><svg class="spinPtr" viewBox="0 0 40 52"><path d="M20 50L4 14A16 16 0 1 1 36 14Z" fill="url(#pg)" stroke="#ffffff" stroke-width="2.5"/><defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6BE38A"/><stop offset="1" stop-color="#1E6A2C"/></linearGradient></defs><circle cx="20" cy="16" r="6" fill="#ffffff"/></svg>
      <svg class="spinWheel" id="spinWheel" viewBox="-166 -166 332 332">${wheelSVG()}</svg>
      <div class="spinHub"></div></div>
    <div class="spinDots" id="spinDots"></div>
    <button class="btn3d spinGo" id="spinGo"></button><p class="spinNote" id="spinNote"></p></div></div>`;
  updSpinUI();
  $("#spinX").addEventListener("click",()=>{SFX.tap();$("#layer").innerHTML=""});
  $("#spinGo").addEventListener("click",doSpin);
}
let spinning=false,spinAngle=0;
function updSpinUI(){const t=SL(),b=$("#spinGo");if(!b)return;const left=spinLeft();
  $("#spinDots").innerHTML=Array.from({length:SPIN_MAX},(_,i)=>`<i class="${i<left?"on":""}"></i>`).join("");
  const nt=$("#spinNote");if(nt)nt.textContent=left<=0?t.soon:spinFree()?t.free:t.more;
  if(left<=0){b.textContent=t.soon;b.disabled=true;return}
  b.disabled=false;b.innerHTML=spinFree()?t.go:`<svg viewBox="0 0 24 24" width="20" height="20" style="vertical-align:-3px;margin-right:6px"><rect x="2" y="5" width="20" height="14" rx="3" fill="currentColor"/><path d="M10 9v6l5-3z" fill="#2C873A"/></svg>${t.go}`}
async function doSpin(){if(spinning||spinLeft()<=0)return;initAudio();
  if(!spinFree()){const b=$("#spinGo");b.disabled=true;b.textContent="…";const ok=await window.showRewardedAd();if(!ok){updSpinUI();return}}
  spinning=true;S.spin.used++;save();updSpinUI();$("#spinGo").disabled=true;
  let r=Math.random()*SPIN_W.reduce((a,b)=>a+b),k=0;while(r>=SPIN_W[k]){r-=SPIN_W[k];k++}
  const n=SPIN_SEG.length,seg=360/n,target=-(k*seg)+(Math.random()-.5)*seg*.6;
  spinAngle=spinAngle-(spinAngle%360)+360*6+target;const w=$("#spinWheel");
  w.style.transition="transform 4.6s cubic-bezier(.12,.75,.12,1)";w.style.transform=`rotate(${spinAngle}deg)`;
  let last=0;const t0=performance.now();(function tick(){if(!spinning)return;const m=new DOMMatrix(getComputedStyle(w).transform),ang=Math.atan2(m.b,m.a)*180/Math.PI,s=Math.floor((ang+360+seg/2)/seg);if(s!==last){last=s;if(ok())tone(1400,now(),.03,{vol:.06,rev:0});$(".spinPtr").animate([{transform:"rotate(-14deg)"},{transform:"none"}],{duration:120})}if(performance.now()-t0<4700)requestAnimationFrame(tick)})();
  setTimeout(()=>{spinning=false;const g=SPIN_SEG[k],t=SL();
    if(g.t==="c"){S.coins+=g.v}else{S.freeHints=(S.freeHints||0)+g.v}save();coins(true);updFH();SFX.fanfare();confetti();
    const pop=document.createElement("div");pop.className="spinWon2";
    const icon=g.t==="c"?`<i class="coin big"></i>`:`<svg class="bulb" viewBox="0 0 64 64"><defs><radialGradient id="bg2" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#fffbe6"/><stop offset=".55" stop-color="#ffd86b"/><stop offset="1" stop-color="#d9921e"/></radialGradient></defs><path d="M32 4a20 20 0 0 0-12 36c3 2.5 4 5 4 8h16c0-3 1-5.5 4-8A20 20 0 0 0 32 4z" fill="url(#bg2)" stroke="#8a5410" stroke-width="2"/><rect x="24" y="50" width="16" height="5" rx="2" fill="#c98a2e"/><rect x="26" y="56" width="12" height="4" rx="2" fill="#a86a12"/></svg>`;
    pop.innerHTML=`<div class="rays"></div><div class="glow"></div><div class="rw">${icon}</div><b>${t.won}</b><div class="amt">${g.t==="c"?"+":"×"}<span id="amtN">0</span></div><div class="lbl">${g.t==="c"?t.coinL:t.hint}</div><button class="btn3d" id="collect">${t.collect}</button>`;
    $(".spinBox").appendChild(pop);
    const t0=performance.now();(function cu(tt){const k=Math.min(1,(tt-t0)/900),e=$("#amtN");if(!e)return;e.textContent=Math.round(g.v*(1-(1-k)**3));if(k<1)requestAnimationFrame(cu)})(t0);
    $("#collect").addEventListener("click",()=>{SFX.coin();pop.classList.add("out");setTimeout(()=>{pop.remove();updSpinUI()},260)});updSpinBadge()},4700);
}
function updFH(){const p=$(".price");if(!p)return;const f=S.freeHints||0;p.innerHTML=f>0?`💡 ${f}`:`<i></i>100`;p.classList.toggle("free",f>0)}
function updSpinBadge(){const b=$("#spinBtn");if(b)b.classList.toggle("ready",spinLeft()>0&&spinFree())}
(function(){const row=$(".homeRow");if(!row)return;const b=document.createElement("button");b.className="cardBtn glass spinBtn";b.id="spinBtn";b.setAttribute("aria-label","Wheel");
  b.innerHTML=`<svg viewBox="-20 -20 40 40" width="34" height="34">${[0,1,2,3,4,5,6,7].map(i=>{const a0=(i*45-112.5)*Math.PI/180,a1=a0+Math.PI/4;return `<path d="M0 0L${16*Math.cos(a0)} ${16*Math.sin(a0)}A16 16 0 0 1 ${16*Math.cos(a1)} ${16*Math.sin(a1)}Z" fill="${SPIN_COL[i][0]}"/>`}).join("")}<circle r="16" fill="none" stroke="#ffffff" stroke-width="2.5"/><circle r="4" fill="#ffffff"/></svg><span class="badge">!</span>`;
  row.appendChild(b);b.addEventListener("click",()=>{SFX.tap();openSpin()});updSpinBadge();updFH()})();

goHome();frame();if(spinFree()&&S.lvl>0)setTimeout(()=>{if($("#home").classList.contains("show")&&!$("#layer").innerHTML)openSpin(true)},900);
</script>

</body></html>
