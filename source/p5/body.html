<canvas id="scene"></canvas>

<section class="screen home" id="home">
  <div class="col">
    <div class="bar">
      <div class="coins glass"><span class="coin"></span><span class="cn"></span></div><div></div>
      <button class="rbtn glass" data-set aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg></button>
    </div>
    <div class="logo"><div class="tiles" id="logoTiles"></div><div class="tag glass" id="hSub"></div></div>
    <div class="ring"><svg viewBox="0 0 150 150"><circle cx="75" cy="75" r="68" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="8"/><circle id="ringArc" cx="75" cy="75" r="68" fill="none" stroke="#ffcf3f" stroke-width="8" stroke-linecap="round" stroke-dasharray="427" stroke-dashoffset="427" style="transition:stroke-dashoffset 1s .3s"/></svg>
      <div class="in glass"><div><b id="hNum"></b><span id="hJ"></span></div></div></div>
    <div class="where glass"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg><span id="hPlace"></span></div>
    <div class="homeRow">
      <button class="cardBtn glass" id="collBtn" aria-label="Postcards"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="6" width="16" height="12" rx="2" transform="rotate(-6 11 12)"/><rect x="5" y="5" width="16" height="12" rx="2"/><path d="M8 13l3-3 3 3 2-2 3 3"/></svg><span class="badge" id="collN"></span></button>
      <button class="btn3d" id="playBtn"></button>
    </div>
  </div>
</section>

<section class="screen" id="game">
  <div class="col">
    <div class="bar">
      <button class="rbtn glass" id="homeBtn" aria-label="Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg></button>
      <div class="chip glass"><b id="gLvl"></b><small id="gPlace"></small></div>
      <div class="coins glass"><span class="coin"></span><span class="cn"></span></div>
    </div>
    <div class="cross"><div class="grid" id="grid"></div></div>
    <div class="praise"><div class="ribbon" id="ribbon"></div></div>
    <div class="bubble"><div class="w" id="bubble"></div></div>
    <div class="stage">
      <div class="wheel" id="wheel"><svg id="wline"><defs><filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><g id="wpath"></g></svg>
        <button class="shuffle" id="shuffleBtn" aria-label="Shuffle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h3.5c2 0 3.2 1 4.3 2.6l2.4 4.8C14.3 16 15.5 17 17.5 17H21M3 17h3.5c1.4 0 2.4-.5 3.2-1.4M14.3 8.4C15.1 7.5 16.1 7 17.5 7H21M18.5 4.5L21 7l-2.5 2.5M18.5 14.5L21 17l-2.5 2.5"/></svg></button>
      </div>
      <div class="side sl" aria-hidden="true"><div class="cnt" id="cnt"></div></div>
      <button class="side sr" id="hintBtn" aria-label="Hint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg><span class="price"><i></i>100</span></button>
    </div>
  </div>
</section>

<section class="screen done" id="done">
  <div class="col">
    <div class="bar"><div></div><div></div><div class="coins glass" id="doneCoins"><span class="coin"></span><span class="cn"></span></div></div>
    <div class="banner"><div class="stars" id="stars"></div><div class="ribbon" id="dT"></div></div>
    <div class="reward glass" id="reward"><span class="coin"></span>+<span id="dR"></span></div>
    <div id="doneBody" style="width:100%;display:flex;justify-content:center"></div>
    <button class="btn3d" id="nextBtn"></button>
  </div>
</section>

<div class="toast glass" id="toast" role="status" aria-live="polite"></div>
<div id="layer"></div>
